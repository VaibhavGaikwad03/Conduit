# The -Djdk.net.unixdomain.tmpdir arg is a workaround for THIS machine's loopback/
# Selector fault (see ~/.gradle/gradle.properties). It is harmless elsewhere as long as
# C:\Temp exists; on a different machine you can drop it.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8 -Djdk.net.unixdomain.tmpdir=C:/Temp
org.gradle.caching=true
org.gradle.parallel=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
